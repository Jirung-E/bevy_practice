[workspace]
resolver = "3"
members = [
    "examples/part0/hello_bevy",
    "examples/part1/ecs_basics",
    "examples/part2/space_survivor",
    "examples/part3/file_lens",
    "examples/part4/product_showcase",
    "examples/part5/tps_training",
    "examples/part6/world_editor",
    "examples/part7/production_structure",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
bevy = "0.19"
avian3d = "0.7"
bevy_landmass = "0.12"
ron = "0.12"
serde = { version = "1", features = ["derive"] }

# Bevy의 전체 기능을 MSVC로 링크하면 디버그 PDB 크기 제한(LNK1140)에
# 도달할 수 있습니다. 실습용 dev 빌드는 PDB를 만들지 않아 안정적으로 링크합니다.
[profile.dev]
debug = 0

# 배포 빌드는 crate 경계를 넘어 최적화하고 디버그 정보를 제거합니다.
# 첫 빌드는 느려지지만 실행 파일과 WASM 크기를 줄이는 데 도움이 됩니다.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
