<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#080d17"/>
  <style>
    .title{fill:#67e8f9;font:700 25px monospace}
    .label{fill:#e5e7eb;font:18px monospace}
    .small{fill:#a5b4fc;font:15px monospace}
    .grid{stroke:#64748b;stroke-width:1;fill:#172033}
    .walk{stroke:#22d3ee;stroke-width:2;fill:#0e7490;fill-opacity:.7}
    .blocked{stroke:#fb7185;stroke-width:2;fill:#be123c;fill-opacity:.85}
    .arrow{stroke:#facc15;stroke-width:4;fill:none;marker-end:url(#head)}
  </style>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#facc15"/>
    </marker>
  </defs>
  <text x="28" y="38" class="title">1. GRID CELLS</text>
  <g transform="translate(32 70)">
    <rect width="260" height="260" class="grid"/>
    <g stroke="#64748b">
      <path d="M52 0V260M104 0V260M156 0V260M208 0V260"/>
      <path d="M0 52H260M0 104H260M0 156H260M0 208H260"/>
    </g>
    <rect x="104" y="104" width="52" height="52" class="blocked"/>
    <text x="74" y="286" class="small">cell center test</text>
  </g>
  <path d="M315 200H365" class="arrow"/>
  <text x="342" y="180" text-anchor="middle" class="small">remove</text>
  <text x="390" y="38" class="title">2. REMOVE BLOCKED CELLS</text>
  <g transform="translate(402 70)">
    <g class="walk">
      <rect x="0" y="0" width="260" height="260"/>
      <path d="M52 0V260M104 0V104M104 156V260M156 0V104M156 156V260M208 0V260"/>
      <path d="M0 52H260M0 104H104M156 104H260M0 156H104M156 156H260M0 208H260"/>
    </g>
    <rect x="104" y="104" width="52" height="52" fill="#080d17" stroke="#fb7185" stroke-dasharray="6 5"/>
    <text x="78" y="286" class="small">walkable hole</text>
  </g>
  <path d="M682 200H732" class="arrow"/>
  <text x="707" y="180" text-anchor="middle" class="small">triangulate</text>
  <text x="748" y="38" class="title">3. NAVMESH</text>
  <g transform="translate(760 70)" class="walk">
    <path d="M0 0H208V260H0Z"/>
    <path d="M0 0L52 52M52 0L104 52M104 0L156 52M156 0L208 52
             M0 52L52 104M52 52L104 104M104 52L156 104M156 52L208 104
             M0 104L52 156M52 104L104 156M156 104L208 156
             M0 156L52 208M52 156L104 208M104 156L156 208M156 156L208 208
             M0 208L52 260M52 208L104 260M104 208L156 260M156 208L208 260"/>
    <path d="M52 0V260M104 0V104M104 156V260M156 0V104M156 156V260
             M0 52H208M0 104H104M156 104H208M0 156H104M156 156H208M0 208H208"/>
    <rect x="104" y="104" width="52" height="52" fill="#080d17" stroke="#fb7185" stroke-dasharray="6 5"/>
  </g>
  <text x="500" y="392" text-anchor="middle" class="label">vertices + triangle indices → validate() → NavMesh3d → Island</text>
</svg>
