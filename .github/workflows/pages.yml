name: Deploy mdBook to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install mdBook
        run: cargo install mdbook --version 0.5.4 --locked

      - name: Build book
        run: mdbook build

      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Build browser demo
        shell: pwsh
        run: ./scripts/build-wasm.ps1 -OutputDirectory book/demos/hello_bevy

      - name: Verify browser artifact
        shell: pwsh
        run: |
          $required = @(
            "book/demos/hello_bevy/index.html",
            "book/demos/hello_bevy/hello_bevy.js",
            "book/demos/hello_bevy/hello_bevy_bg.wasm"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing WASM artifact: $path"
            }
          }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
