<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello Bevy WASM</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #090b13;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #63dbff;
        font: 600 20px/1.4 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="loading">Bevy WASM 불러오는 중…</div>
    <script type="module">
      import init from "./hello_bevy.js";

      try {
        await init();
        document.querySelector("#loading")?.remove();
      } catch (error) {
        const loading = document.querySelector("#loading");
        if (loading) {
          loading.textContent = `실행 실패: ${error}`;
        }
        console.error(error);
      }
    </script>
  </body>
</html>
